[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lit-shell"
version = "1.2.1"
description = "Python client for lit-shell WebSocket terminal servers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "lit-shell contributors"}
]
keywords = ["terminal", "websocket", "pty", "shell", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
    "Framework :: AsyncIO",
]
dependencies = [
    "websockets>=13.0,<16; python_version < '3.10'",
    "websockets>=16.1.1,<17; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.19.1,<1.20; python_version < '3.10'",
    "mypy>=1.20.2,<2; python_version >= '3.10'",
    "pip-audit>=2.9.0,<2.10; python_version < '3.10'",
    "pip-audit>=2.10.1,<3; python_version >= '3.10'",
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16.1,<0.17",
]

[project.urls]
Homepage = "https://github.com/lsadehaan/lit-shell"
Documentation = "https://github.com/lsadehaan/lit-shell#readme"
Repository = "https://github.com/lsadehaan/lit-shell"

[tool.setuptools.packages.find]
where = ["."]
include = ["lit_shell*"]

[tool.setuptools.package-data]
lit_shell = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "node_e2e: exercises the packaged Python client against a real lit-shell Node server",
]

[tool.coverage.run]
branch = true
source = ["lit_shell"]

[tool.coverage.report]
fail_under = 87
precision = 2
show_missing = true

[tool.ruff]
include = ["lit_shell/**/*.py", "tests/**/*.py"]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["ASYNC", "B", "E4", "E7", "E9", "F", "I", "RUF"]

[tool.mypy]
files = ["lit_shell"]
python_version = "3.9"
strict = true
