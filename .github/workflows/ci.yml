name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', 24, 26]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts && npm run deps:build

      - name: Type-check
        run: npm run typecheck

      - name: Build package
        run: npm run build

      - name: Run unit and protocol tests
        run: npm test

      - name: Run example HTTP boundary tests
        run: npm run test:examples

  os-compatibility:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts && npm run deps:build

      - name: Type-check and build
        run: npm run typecheck && npm run build

      - name: Run portable unit tests
        run: npm run test:unit

      - name: Spawn the platform PTY
        run: npm run test:pty-smoke

  quality:
    name: Coverage, CRAP, and static quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts && npm run deps:build

      - name: Check formatting
        run: npm run format:check

      - name: Lint code
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check synchronized public versions
        run: npm run version:check

      - name: Lint documentation
        run: npm run docs:lint

      - name: Find unused code and dependencies
        run: npm run deps:check

      - name: Build and inspect the Pages artifact
        run: npm run pages:check

      - name: Enforce monotonic quality baselines
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: npm run test:quality-policy && npm run quality:policy

      - name: Run coverage suite
        run: npm run test:coverage

      - name: Generate CRAP report
        run: npm run crap:report

      - name: Enforce CRAP ratchet
        run: npm run crap:ratchet

      - name: Upload coverage and CRAP reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: |
            coverage/
            reports/
          if-no-files-found: warn
          retention-days: 14

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts && npm run deps:build

      - name: Build browser, server, and Pages artifacts
        run: |
          npm run build
          npm run pages:check
          npm run pages:check:enabled

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run black-box browser tests
        run: npm run test:e2e:browser

      - name: Upload Playwright report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  python-contract:
    name: Python ${{ matrix.python }} contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      - name: Install Python binding and test tools
        working-directory: bindings/python
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run deterministic Python contract tests
        working-directory: bindings/python
        run: >-
          python -m pytest -m 'not node_e2e'
          --junitxml=pytest-${{ matrix.python }}.xml

      - name: Enforce Python static quality and branch coverage
        if: ${{ matrix.python == '3.14' }}
        working-directory: bindings/python
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m pytest -m 'not node_e2e' \
            --cov=lit_shell --cov-branch \
            --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Audit Python runtime dependencies
        working-directory: bindings/python
        run: python -m pip_audit .

      - name: Upload Python test report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-${{ matrix.python }}
          path: |
            bindings/python/pytest-${{ matrix.python }}.xml
            bindings/python/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  python-node-e2e:
    name: Python ↔ Node E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      - name: Install and build Node package
        run: npm ci --ignore-scripts && npm run deps:build && npm run build

      - name: Install Python binding and test tools
        working-directory: bindings/python
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run Python against the real Node server and PTY
        working-directory: bindings/python
        run: python -m pytest -m node_e2e --junitxml=pytest-node-e2e.xml

      - name: Upload Python E2E report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-node-e2e
          path: bindings/python/pytest-node-e2e.xml
          if-no-files-found: warn
          retention-days: 14

  package-integrity:
    name: Package and dependency integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci --ignore-scripts && npm run deps:build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify dependency install-script policy
        run: npm run deps:scripts:check

      - name: Validate package exports and types
        run: npm run package:check

      - name: Install and audit independent examples
        run: |
          npm ci --prefix examples/docker-container --install-links --ignore-scripts
          npm run --prefix examples/docker-container deps:build
          npm audit --prefix examples/docker-container --audit-level=high
          npm ci --prefix examples/multiplexing --install-links --ignore-scripts
          npm run --prefix examples/multiplexing deps:build
          npm audit --prefix examples/multiplexing --audit-level=high

      - name: Smoke-test the multiplexing example boundary
        run: npm run test:example-server

      - name: Create package artifact, checksum, and SBOM
        run: |
          mkdir -p package-artifact
          npm pack --pack-destination package-artifact
          npm sbom --omit=dev --sbom-format cyclonedx > package-artifact/sbom.cdx.json
          (cd package-artifact && sha256sum *.tgz > SHA256SUMS)

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: package-artifact/
          if-no-files-found: error
          retention-days: 14

  container-integrity:
    name: Container build and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Dockerfile
        run: docker build --check --file docker/Dockerfile .

      - name: Validate Compose model
        env:
          DOCKER_GID: '999'
        run: docker compose --file docker/docker-compose.yml config --quiet

      - name: Build production image
        run: docker build --file docker/Dockerfile --tag lit-shell-ci .

      - name: Verify the runtime excludes package managers
        run: |
          docker run --rm --entrypoint /bin/sh lit-shell-ci -c '
            for command in corepack npm npx yarn yarnpkg; do
              if command -v "$command" >/dev/null 2>&1; then
                echo "unexpected runtime command: $command" >&2
                exit 1
              fi
            done
          '

      - name: Verify non-root PTY runtime and health check
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' lit-shell-ci)" = 'node'
          test "$(docker run --rm lit-shell-ci id -u)" = '1000'
          docker run --rm lit-shell-ci node --input-type=module --eval \
            "const pty = (await import('node-pty')).default;
            const terminal = pty.spawn('/bin/sh', ['-c', 'printf container-pty-ok']);
            terminal.onData((data) => process.stdout.write(data));
            terminal.onExit(({ exitCode }) => { process.exitCode = exitCode; });"

          container_id="$(docker run --detach \
            --health-interval=1s --health-start-period=1s lit-shell-ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_id")"
            if [ "$health" = 'healthy' ]; then
              exit 0
            fi
            if [ "$health" = 'unhealthy' ]; then
              break
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1

      - name: Exercise Docker listing and exec over the public protocol
        run: |
          server_name='lit-shell-ci-server'
          target_name='test-lit-shell-ci'
          cleanup() {
            docker rm --force "$server_name" "$target_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$target_name" \
            --user 65534:65534 --read-only --tmpfs /tmp:mode=1777,size=8m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            lit-shell-ci sleep infinity

          socket_gid="$(stat --format '%g' /var/run/docker.sock)"
          docker run --detach --name "$server_name" \
            --group-add "$socket_gid" --read-only \
            --tmpfs /tmp:mode=1777,size=32m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            --volume "$PWD/tests/fixtures/docker-protocol-smoke.mjs:/app/tests/docker-protocol-smoke.mjs:ro" \
            --env LIT_SHELL_ALLOWED_ORIGINS=http://127.0.0.1:3000 \
            lit-shell-ci

          for attempt in $(seq 1 30); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$server_name")"
            if [ "$health" = 'healthy' ]; then
              break
            fi
            if [ "$health" = 'unhealthy' ] || [ "$attempt" = '30' ]; then
              docker logs "$server_name"
              exit 1
            fi
            sleep 1
          done

          docker exec \
            --env LIT_SHELL_SMOKE_URL=ws://127.0.0.1:3000/terminal \
            --env LIT_SHELL_SMOKE_ORIGIN=http://127.0.0.1:3000 \
            --env LIT_SHELL_SMOKE_CONTAINER="$target_name" \
            "$server_name" node tests/docker-protocol-smoke.mjs

      - name: Scan the final image for fixed high-severity vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --exit-code 1 --ignore-unfixed \
            --scanners vuln --severity HIGH,CRITICAL \
            lit-shell-ci

  remote-demo-integrity:
    name: Remote demo shared environment and image
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate and build the disposable image
        run: |
          docker build --check --file deploy/remote-shell/Dockerfile .
          docker build --file deploy/remote-shell/Dockerfile \
            --tag lit-shell-remote-demo-ci .
          test "$(docker image inspect --format '{{.Config.User}}' \
            lit-shell-remote-demo-ci)" = '0:0'
          docker run --rm --entrypoint /bin/sh lit-shell-remote-demo-ci -c '
            set -eu
            for command in corepack npm npx yarn yarnpkg; do
              if command -v "$command" >/dev/null 2>&1; then
                echo "unexpected remote demo runtime command: $command" >&2
                exit 1
              fi
            done
            test -z "$(find / -xdev -type f -perm /6000 -print -quit)"
            test -d /app/node_modules/ws
            test -d /app/node_modules/node-pty
            test -d /app/node_modules/node-addon-api
            test "$(find /app/node_modules -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 3
          '

      - name: Prove a missing identity capability fails closed
        run: |
          container_name='lit-shell-remote-demo-negative-ci'
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container_name" \
            --read-only --tmpfs /workspace:mode=0755,size=32m \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE \
            --cap-add KILL --cap-add SETGID --cap-add SETPCAP \
            --security-opt no-new-privileges:true \
            --env LIT_SHELL_ALLOWED_ORIGIN=https://example.com \
            --env LIT_SHELL_TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA \
            lit-shell-remote-demo-ci
          for attempt in $(seq 1 20); do
            status="$(docker inspect --format '{{.State.Status}}' "$container_name")"
            if [ "$status" = 'exited' ]; then
              break
            fi
            sleep 0.5
          done
          test "$(docker inspect --format '{{.State.Status}}' "$container_name")" = exited
          test "$(docker inspect --format '{{.State.ExitCode}}' "$container_name")" -ne 0
          docker logs "$container_name" 2>&1 \
            | grep --quiet --fixed-strings \
              'The fixed guest identity transition is unavailable'

      - name: Prove failed CAPTCHA verification with the required identity capability
        run: |
          set -eu
          container_name='lit-shell-remote-demo-captcha-failure-ci'
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          docker run --detach --name "$container_name" \
            --read-only --tmpfs /tmp:mode=0755,size=8m \
            --tmpfs /workspace:mode=0755,size=32m \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE \
            --cap-add KILL --cap-add SETGID --cap-add SETPCAP \
            --cap-add SETUID --security-opt no-new-privileges:true \
            --memory 512m --pids-limit 64 --cpus 1 \
            --health-interval=1s --health-start-period=1s \
            --env LIT_SHELL_ALLOWED_ORIGIN=https://example.com \
            --env LIT_SHELL_TURNSTILE_SECRET_KEY=2x0000000000000000000000000000000AA \
            lit-shell-remote-demo-ci

          for attempt in $(seq 1 45); do
            state="$(docker inspect --format '{{.State.Status}}' "$container_name")"
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$state" = exited ] || [ "$health" = unhealthy ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_name")" = healthy

          docker exec "$container_name" node --input-type=module --eval '
            const response = await fetch(
              "http://127.0.0.1:10000/v1/admissions",
              {
                body: new URLSearchParams({
                  turnstileToken: "well-formed-test-response",
                }),
                headers: { Origin: "https://example.com" },
                method: "POST",
              },
            );
            if (response.status !== 403) {
              throw new Error(`expected CAPTCHA rejection status 403, received ${response.status}`);
            }
            const body = await response.json();
            if (body.error !== "Human verification failed") {
              throw new Error("CAPTCHA rejection did not fail closed");
            }
          '

      - name: Exercise shared guests, CAPTCHA, quotas, and epoch reset
        env:
          BUILD_REVISION: ${{ github.sha }}
        run: |
          container_name='lit-shell-remote-demo-positive-ci'
          docker run --detach --name "$container_name" \
            --read-only --tmpfs /tmp:mode=0755,size=8m \
            --tmpfs /workspace:mode=0755,size=32m \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE \
            --cap-add KILL --cap-add SETGID --cap-add SETPCAP \
            --cap-add SETUID --security-opt no-new-privileges:true \
            --memory 512m --pids-limit 64 --cpus 1 \
            --health-interval=1s --health-start-period=1s \
            --env LIT_SHELL_ALLOWED_ORIGIN=https://example.com \
            --env LIT_SHELL_HOST_CANARY=gateway-environment-must-not-cross \
            --env LIT_SHELL_TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA \
            --env RENDER_GIT_COMMIT="$BUILD_REVISION" \
            --volume "$PWD/tests/fixtures/remote-demo-container-smoke.mjs:/app/remote-demo-container-smoke.mjs:ro" \
            lit-shell-remote-demo-ci
          for attempt in $(seq 1 45); do
            health="$(docker inspect --format '{{.State.Health.Status}}' "$container_name")"
            if [ "$health" = healthy ]; then
              break
            fi
            if [ "$health" = unhealthy ]; then
              docker logs "$container_name"
              exit 1
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container_name")" = healthy
          docker exec \
            --env LIT_SHELL_SMOKE_ORIGIN=http://127.0.0.1:10000 \
            "$container_name" node /app/remote-demo-container-smoke.mjs

      - name: Scan the final image for fixed high-severity vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --exit-code 1 --ignore-unfixed \
            --scanners vuln --severity HIGH,CRITICAL \
            lit-shell-remote-demo-ci

      - name: Report and clean up the runtime container
        if: ${{ always() }}
        run: |
          docker logs lit-shell-remote-demo-positive-ci 2>&1 || true
          docker rm --force lit-shell-remote-demo-positive-ci \
            >/dev/null 2>&1 || true

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - node-compatibility
      - os-compatibility
      - quality
      - browser-e2e
      - python-contract
      - python-node-e2e
      - package-integrity
      - container-integrity
      - remote-demo-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every CI job to succeed
        env:
          NODE_COMPATIBILITY_RESULT: ${{ needs['node-compatibility'].result }}
          OS_COMPATIBILITY_RESULT: ${{ needs['os-compatibility'].result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_E2E_RESULT: ${{ needs['browser-e2e'].result }}
          PYTHON_CONTRACT_RESULT: ${{ needs['python-contract'].result }}
          PYTHON_NODE_E2E_RESULT: ${{ needs['python-node-e2e'].result }}
          PACKAGE_INTEGRITY_RESULT: ${{ needs['package-integrity'].result }}
          CONTAINER_INTEGRITY_RESULT: ${{ needs['container-integrity'].result }}
          REMOTE_DEMO_INTEGRITY_RESULT: ${{ needs['remote-demo-integrity'].result }}
        run: |
          results=(
            "node-compatibility=$NODE_COMPATIBILITY_RESULT"
            "os-compatibility=$OS_COMPATIBILITY_RESULT"
            "quality=$QUALITY_RESULT"
            "browser-e2e=$BROWSER_E2E_RESULT"
            "python-contract=$PYTHON_CONTRACT_RESULT"
            "python-node-e2e=$PYTHON_NODE_E2E_RESULT"
            "package-integrity=$PACKAGE_INTEGRITY_RESULT"
            "container-integrity=$CONTAINER_INTEGRITY_RESULT"
            "remote-demo-integrity=$REMOTE_DEMO_INTEGRITY_RESULT"
          )
          gate_failed=0
          for entry in "${results[@]}"; do
            job_name="${entry%%=*}"
            job_result="${entry#*=}"
            echo "$job_name: $job_result"
            if [ "$job_result" != 'success' ]; then
              gate_failed=1
            fi
          done
          exit "$gate_failed"

  remote-demo-production:
    name: Deploy and smoke test remote demo
    if: >-
      ${{
        github.ref == 'refs/heads/master' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}
    needs: ci-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: remote-demo-production

    steps:
      - name: Check out the exact reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install the locked smoke-test dependency
        run: npm ci --omit=dev --ignore-scripts

      - name: Validate the optional production deployment configuration
        id: deployment_config
        env:
          REMOTE_DEMO_ORIGIN: ${{ vars.REMOTE_DEMO_ORIGIN }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          if [ -z "$REMOTE_DEMO_ORIGIN" ] \
            && [ -z "$RENDER_API_TOKEN" ] \
            && [ -z "$RENDER_SERVICE_ID" ] \
            && [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Remote demo deployment is not configured; keeping it disabled.'
            exit 0
          fi
          if [ -z "$REMOTE_DEMO_ORIGIN" ] \
            || [ -z "$RENDER_API_TOKEN" ] \
            || [ -z "$RENDER_SERVICE_ID" ] \
            || [ -z "$TURNSTILE_SITE_KEY" ]; then
            echo 'REMOTE_DEMO_ORIGIN, RENDER_API_TOKEN, RENDER_SERVICE_ID, and TURNSTILE_SITE_KEY must be configured together.' >&2
            exit 1
          fi
          node --input-type=module --eval '
            const origin = new URL(process.env.REMOTE_DEMO_ORIGIN ?? "");
            if (
              origin.protocol !== "https:" ||
              origin.origin !== process.env.REMOTE_DEMO_ORIGIN
            ) throw new Error("REMOTE_DEMO_ORIGIN must be one exact HTTPS origin");
            if (!/^srv-[a-z0-9]+$/.test(process.env.RENDER_SERVICE_ID ?? "")) {
              throw new Error("RENDER_SERVICE_ID must be one Render service ID");
            }
            if (!/^[A-Za-z0-9_-]{20,64}$/.test(process.env.TURNSTILE_SITE_KEY ?? "")) {
              throw new Error("TURNSTILE_SITE_KEY is malformed");
            }
          '
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Trigger deployment of the exact reviewed revision
        if: ${{ steps.deployment_config.outputs.configured == 'true' }}
        env:
          BUILD_REVISION: ${{ github.sha }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          payload="$(jq --null-input --compact-output \
            --arg commit_id "$BUILD_REVISION" \
            '{commitId: $commit_id, clearCache: "do_not_clear"}')"
          deploy_status="$(curl --silent --show-error --max-time 30 \
            --proto '=https' --request POST --output render-deploy.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $RENDER_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          case "$deploy_status" in
            201|202) ;;
            *)
              echo "Render rejected the exact-commit deployment with HTTP $deploy_status" >&2
              exit 1
              ;;
          esac

      - name: Wait for the exact backend revision
        if: ${{ steps.deployment_config.outputs.configured == 'true' }}
        env:
          BUILD_REVISION: ${{ github.sha }}
          REMOTE_DEMO_ORIGIN: ${{ vars.REMOTE_DEMO_ORIGIN }}
        run: |
          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error --max-time 30 \
              --proto '=https' --output remote-health.json \
              "$REMOTE_DEMO_ORIGIN/health/live" \
              && jq --exit-status --arg revision "$BUILD_REVISION" \
                '.status == "live" and .revision == $revision' \
                remote-health.json >/dev/null; then
              exit 0
            fi
            if [ "$attempt" = 180 ]; then
              echo 'The exact remote backend revision did not become live' >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify the live shared demo control plane
        if: ${{ steps.deployment_config.outputs.configured == 'true' }}
        env:
          BUILD_REVISION: ${{ github.sha }}
          LIT_SHELL_ALLOWED_ORIGIN: https://www.idnteq.net
          REMOTE_DEMO_ORIGIN: ${{ vars.REMOTE_DEMO_ORIGIN }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --proto '=https' --output remote-ready.json \
            "$REMOTE_DEMO_ORIGIN/health/ready"
          jq --exit-status --arg revision "$BUILD_REVISION" '
            .status == "ready"
            and .revision == $revision
            and .admission.capacity == 4
            and (.resetAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) > now
          ' remote-ready.json >/dev/null

          node --input-type=module --eval '
            const serviceOrigin = process.env.REMOTE_DEMO_ORIGIN;
            const allowedOrigin = process.env.LIT_SHELL_ALLOWED_ORIGIN;
            if (!serviceOrigin || !allowedOrigin) {
              throw new Error("remote demo smoke-test origins are required");
            }
            const postAdmission = (origin, body) =>
              fetch(`${serviceOrigin}/v1/admissions`, {
                body,
                headers: {
                  "content-type": "application/x-www-form-urlencoded",
                  Origin: origin,
                },
                method: "POST",
              });

            const disallowed = await postAdmission(
              "https://disallowed.invalid",
              new URLSearchParams({
                turnstileToken: "well-formed-but-never-verified",
              }),
            );
            if (disallowed.status !== 403) {
              throw new Error(`expected disallowed-origin status 403, received ${disallowed.status}`);
            }
            if (disallowed.headers.has("access-control-allow-origin")) {
              throw new Error("disallowed origin received a CORS allowance");
            }
            const disallowedBody = await disallowed.json();
            if (disallowedBody.error !== "Origin is not allowed") {
              throw new Error("disallowed origin reached CAPTCHA verification");
            }

            const malformed = await postAdmission(
              allowedOrigin,
              new URLSearchParams({ turnstileToken: "" }),
            );
            if (malformed.status !== 400) {
              throw new Error(`expected malformed-token status 400, received ${malformed.status}`);
            }
            if (
              malformed.headers.get("access-control-allow-origin") !==
                allowedOrigin ||
              malformed.headers.get("vary") !== "Origin"
            ) {
              throw new Error("allowed-origin CORS headers are not exact");
            }
            const malformedBody = await malformed.json();
            if (malformedBody.error !== "Verification token is malformed") {
              throw new Error("malformed token did not fail before CAPTCHA verification");
            }
          '

          websocket_status="$(curl --http1.1 --silent --show-error \
            --max-time 30 --proto '=https' --output websocket-rejection.txt \
            --write-out '%{http_code}' \
            --header "Origin: $LIT_SHELL_ALLOWED_ORIGIN" \
            --header 'Connection: Upgrade' \
            --header 'Upgrade: websocket' \
            --header 'Sec-WebSocket-Version: 13' \
            --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
            --header 'Sec-WebSocket-Protocol: lit-shell.v1' \
            "$REMOTE_DEMO_ORIGIN/terminal")"
          if [ "$websocket_status" != 401 ]; then
            cat websocket-rejection.txt >&2
            echo "Expected unauthenticated WebSocket status 401; received $websocket_status" >&2
            exit 1
          fi
