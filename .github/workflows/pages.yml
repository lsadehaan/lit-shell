name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static demo
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      checks: read
      contents: read
      pages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the repository npm version
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Rebuild the reviewed browser-build dependency
        run: >-
          npm rebuild
          --ignore-scripts=false
          --strict-allow-scripts=true
          esbuild

      - name: Wait for the exact CI and remote backend revisions
        env:
          BUILD_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REMOTE_DEMO_ORIGIN: ${{ vars.REMOTE_DEMO_ORIGIN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          wait_for_check() {
            check_name="$1"
            max_attempts="$2"
            for attempt in $(seq 1 "$max_attempts"); do
              conclusion="$(gh api \
                "repos/$REPOSITORY/commits/$BUILD_REVISION/check-runs?per_page=100" \
                --jq "[.check_runs[] | select(.name == \"$check_name\")]
                  | sort_by(.id) | last | .conclusion // \"pending\"")"
              case "$conclusion" in
                success) return ;;
                pending) ;;
                *)
                  echo "$check_name concluded $conclusion for $BUILD_REVISION" >&2
                  exit 1
                  ;;
              esac
              if [ "$attempt" = "$max_attempts" ]; then
                echo "$check_name did not finish for $BUILD_REVISION" >&2
                exit 1
              fi
              sleep 10
            done
          }
          wait_for_check 'CI gate' 180
          if [ -z "$REMOTE_DEMO_ORIGIN" ]; then
            exit 0
          fi
          wait_for_check 'Deploy and smoke test remote demo' 240
          node -e '
            const value = process.env.REMOTE_DEMO_ORIGIN;
            const url = new URL(value);
            if (url.protocol !== "https:" || url.origin !== value) process.exit(1);
          '
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 30 \
              --proto '=https' --output remote-health.json \
              "$REMOTE_DEMO_ORIGIN/health/live" \
              && jq --exit-status --arg revision "$BUILD_REVISION" \
                '.status == "live" and .revision == $revision' \
                remote-health.json >/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              echo "The exact remote backend revision did not remain live" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Require HTTPS-only Pages before enabling the remote shell
        env:
          REMOTE_DEMO_ORIGIN: ${{ vars.REMOTE_DEMO_ORIGIN }}
        run: |
          if [ -z "$REMOTE_DEMO_ORIGIN" ]; then
            exit 0
          fi
          redirect_status="$(curl --silent --show-error --max-time 30 \
            --proto '=http' --output /dev/null --dump-header redirect.headers \
            --write-out '%{http_code}' http://www.idnteq.net/lit-shell/)"
          redirect_location="$(awk '
            BEGIN { IGNORECASE = 1 }
            /^location:/ {
              sub(/^[^:]*:[[:space:]]*/, "")
              sub(/\r$/, "")
              print
            }
          ' redirect.headers | tail -n 1)"
          if { [ "$redirect_status" != 301 ] \
            && [ "$redirect_status" != 308 ]; } \
            || [ "$redirect_location" != https://www.idnteq.net/lit-shell/ ]; then
            echo 'Pages is not permanently redirected to the expected HTTPS URL' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --proto '=https' --output /dev/null \
            https://www.idnteq.net/lit-shell/

      - name: Build and verify the static artifact
        env:
          LIT_SHELL_REMOTE_DEMO_ORIGIN: ${{ vars.REMOTE_DEMO_ORIGIN }}
        run: npm run pages:check

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the static artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy static demo
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  verify:
    name: Verify live demo
    if: ${{ success() }}
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Fetch the deployed page and application
        env:
          BUILD_REVISION: ${{ github.sha }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          REMOTE_DEMO_ORIGIN: ${{ vars.REMOTE_DEMO_ORIGIN }}
        run: |
          case "$PAGE_URL" in
            https://lsadehaan.github.io/lit-shell/|https://www.idnteq.net/lit-shell/) ;;
            http://www.idnteq.net/lit-shell/)
              redirect_status="$(curl --silent --show-error --max-time 30 \
                --proto '=http' --output /dev/null --dump-header redirect.headers \
                --write-out '%{http_code}' "$PAGE_URL")"
              redirect_location="$(awk '
                BEGIN { IGNORECASE = 1 }
                /^location:/ {
                  sub(/^[^:]*:[[:space:]]*/, "")
                  sub(/\r$/, "")
                  print
                }
              ' redirect.headers | tail -n 1)"
              if { [ "$redirect_status" != 301 ] \
                && [ "$redirect_status" != 308 ]; } \
                || [ "$redirect_location" != https://www.idnteq.net/lit-shell/ ]; then
                echo "Pages HTTP URL does not permanently redirect to the expected HTTPS URL" >&2
                exit 1
              fi
              PAGE_URL="$redirect_location"
              ;;
            *) echo "Unexpected Pages URL: $PAGE_URL" >&2; exit 1 ;;
          esac
          for attempt in $(seq 1 12); do
            if curl --fail --location --retry 3 --retry-all-errors \
              --retry-delay 2 --silent --show-error --proto '=https' \
              --proto-redir '=https' \
              --output page.html "$PAGE_URL" \
              && grep --quiet --fixed-strings 'Browser-only simulation' page.html \
              && grep --quiet --fixed-strings \
                "content=\"$BUILD_REVISION\"" page.html; then
              break
            fi
            if [ "$attempt" = 12 ]; then
              echo "The deployed revision did not become available" >&2
              exit 1
            fi
            sleep 5
          done
          curl --fail --location --retry 10 --retry-all-errors \
            --retry-delay 5 --silent --show-error --proto '=https' \
            --proto-redir '=https' \
            --output demo.js "${PAGE_URL}assets/demo.js"
          test -s demo.js
          curl --fail --location --retry 10 --retry-all-errors \
            --retry-delay 5 --silent --show-error --proto '=https' \
            --proto-redir '=https' \
            --output remote.html "${PAGE_URL}remote/"
          grep --quiet --fixed-strings 'discussions/34' remote.html
          grep --quiet --fixed-strings \
            "content=\"$BUILD_REVISION\"" remote.html
          curl --fail --location --retry 10 --retry-all-errors \
            --retry-delay 5 --silent --show-error --proto '=https' \
            --proto-redir '=https' \
            --output remote-demo.js "${PAGE_URL}assets/remote-demo.js"
          test -s remote-demo.js
          grep --quiet --fixed-strings \
            "lit-shell-remote-build:$BUILD_REVISION" remote-demo.js
          if [ -n "$REMOTE_DEMO_ORIGIN" ]; then
            grep --quiet --fixed-strings \
              "content=\"$REMOTE_DEMO_ORIGIN\"" remote.html
          else
            grep --quiet --fixed-strings "connect-src 'none'" remote.html
          fi
